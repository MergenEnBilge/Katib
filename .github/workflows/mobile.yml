name: mobile

# Builds the phone apps when a version tag such as v0.1.0 is pushed, or when run by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: installers/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Capacitor 7 compiles against Java 21. An older one fails with "invalid source release".
          java-version: 21
      - run: npm ci
      - run: npm run add:android
      - run: npm run assets
      - run: npm run sync

      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/katib.jks"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Sign releases with that key
        if: steps.key.outputs.signed == 'yes'
        working-directory: installers/mobile/android
        run: |
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KATIB_STORE_FILE"))
                      storePassword System.getenv("KATIB_STORE_PASSWORD")
                      keyAlias System.getenv("KATIB_KEY_ALIAS")
                      keyPassword System.getenv("KATIB_KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Build a signed release
        if: steps.key.outputs.signed == 'yes'
        working-directory: installers/mobile/android
        env:
          KATIB_STORE_FILE: ${{ runner.temp }}/katib.jks
          KATIB_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KATIB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KATIB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../Katib-android.apk

      - name: Build a debug-signed app
        if: steps.key.outputs.signed != 'yes'
        working-directory: installers/mobile/android
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../Katib-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: katib-android
          path: installers/mobile/Katib-android.apk
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: installers/mobile/Katib-android.apk

  ios:
    # Apple will not let an app onto a phone without a signing certificate, so this only proves the
    # project still builds. To put it on your own iPhone, open it in Xcode. See mobile/README.md.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: installers/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run add:ios
      - run: npm run assets:ios
      - run: npm run sync
      - name: Build it without signing
        working-directory: installers/mobile/ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
