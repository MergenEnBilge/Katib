name: android

# Builds the Android app when a version tag such as v0.1.0 is pushed, or when run by hand.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run add
      - run: npm run assets
      - run: npm run sync

      - name: Signing key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/katib.jks"
            echo "signed=yes" >> "$GITHUB_OUTPUT"
          fi

      - name: Build a signed release
        if: steps.key.outputs.signed == 'yes'
        working-directory: android-app/android
        env:
          KATIB_STORE_FILE: ${{ runner.temp }}/katib.jks
          KATIB_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KATIB_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KATIB_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cat >> app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KATIB_STORE_FILE"))
                      storePassword System.getenv("KATIB_STORE_PASSWORD")
                      keyAlias System.getenv("KATIB_KEY_ALIAS")
                      keyPassword System.getenv("KATIB_KEY_PASSWORD")
                  }
                  buildTypes { release { signingConfig signingConfigs.release } }
              }
          }
          GRADLE
          ./gradlew assembleRelease
          cp app/build/outputs/apk/release/app-release.apk ../../Katib-android.apk

      - name: Build a debug-signed app
        if: steps.key.outputs.signed != 'yes'
        working-directory: android-app/android
        run: |
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../../Katib-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: katib-android
          path: Katib-android.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: android-app/Katib-android.apk
