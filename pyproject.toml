[project]
name = "katib"
version = "0.1.0"
description = "Self-hostable data annotation tool"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0,<2.1",
    "alembic>=1.13",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.13",
    "platformdirs>=4.3",
    "orjson>=3.10",
    "pillow>=10.4",
    "python-multipart>=0.0.12",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "segno>=1.6.6",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
ml = [
    "onnxruntime>=1.20",
]
postgres = [
    "psycopg[binary]>=3.2",
]
desktop = [
    "pywebview>=5",
]

[project.scripts]
katib = "katib.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/katib"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.115",
    "ruff>=0.7",
    "pyright>=1.1.385",
    "import-linter>=2.1",
    "httpx>=0.27",
    "types-pyyaml>=6.0.12.20260906",
    "onnx>=1.17",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"src/katib/db/migrations/versions/*" = ["I001", "E501"]

[tool.pyright]
include = ["src"]
venvPath = "."
venv = ".venv"
strict = ["src/katib/core", "src/katib/services"]


[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["slow: test takes over about a second"]

[tool.importlinter]
root_package = "katib"

[[tool.importlinter.contracts]]
name = "layers"
type = "layers"
layers = [
    "katib.api",
    "katib.services",
    "katib.jobs",
    "katib.db | katib.storage",
    "katib.core",
]

[[tool.importlinter.contracts]]
name = "core has no I/O dependencies"
type = "forbidden"
source_modules = ["katib.core"]
forbidden_modules = ["katib.db", "katib.api", "katib.services", "katib.storage", "katib.jobs"]

[[tool.importlinter.contracts]]
name = "formats never touch the database"
type = "forbidden"
source_modules = ["katib.formats"]
forbidden_modules = ["katib.db"]
