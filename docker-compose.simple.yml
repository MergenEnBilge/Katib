# Katib on one machine, with nothing else to set up. Your projects live in a Docker volume.
#
#   docker compose -f docker-compose.simple.yml up -d
#
# Then open http://localhost:8420. For a team with HTTPS, use docker-compose.yml instead.

services:
  katib:
    # To run your own changes instead of the published build, swap this line for "build: ."
    image: ghcr.io/mergenenbilge/katib:v0.1.0-rc2
    restart: unless-stopped
    ports:
      - "8420:8420"
    volumes:
      - katib-data:/data
      # Photos you want to label. Connect /photos from the Import window.
      - ${KATIB_PHOTOS:-./photos}:/photos:ro

volumes:
  katib-data:
